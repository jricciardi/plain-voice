name: New tell
description: Report a word, phrase or habit that makes AI replies read like stock AI and that plain-voice doesn't cover yet.
title: "New tell: "
body:
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Paste the sentence or two where it showed up. Remove anything private.
    validations:
      required: true
  - type: input
    id: tell
    attributes:
      label: The tell
      description: The word, phrase or pattern, in a few words.
      placeholder: Opening a follow-up with "You're absolutely right"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: Which model wrote it, as exactly as you know.
      placeholder: Claude Opus 5.5, or "ChatGPT, default model"
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App or tool
      placeholder: ChatGPT, Claude, Gemini, Copilot CLI, Claude Code
  - type: dropdown
    id: installed
    attributes:
      label: Was plain-voice installed?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: How often you see it, or why it bugs you.

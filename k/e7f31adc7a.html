<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Reading test</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e1dc;
  --accent: #2f5bd3; --flag: #ffe27a; --flag-ink: #1d1d1f; --btn: #efeeea; --on: #1d1d1f; --on-ink: #ffffff;
  --bubble: #eef2fb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151517; --card: #1f1f22; --ink: #ececee; --muted: #a0a0a8; --line: #333338;
    --accent: #8aa9ff; --flag: #6b5a00; --flag-ink: #fff4c2; --btn: #2a2a2e; --on: #ececee; --on-ink: #151517;
    --bubble: #232838;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
main { max-width: 700px; margin: 0 auto; padding: 14px 14px 110px; }
h1 { font-size: 1.45rem; margin: 10px 0 6px; }
h2.screen { font-size: 1.2rem; margin: 6px 0 12px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
.label { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--muted); }
.dots { display: flex; gap: 4px; }
.dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots span.done { background: var(--muted); }
.dots span.now { background: var(--accent); }
.banner { background: var(--bubble); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; margin: 10px 0; }
.prompt-body { position: relative; }
.prompt-body.clip { max-height: 7.5em; overflow: hidden; }
.prompt-body.clip::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.5em; background: linear-gradient(transparent, var(--card)); }
.md p, .md ul, .md ol, .md pre, .md blockquote { margin: 0 0 10px; }
.md p:last-child { margin-bottom: 0; }
.md ul, .md ol { padding-left: 1.4em; }
.md li { margin: 2px 0; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 12px 0 6px; line-height: 1.3; }
.md h1, .md h2 { font-size: 1.2em; }
.md h3, .md h4, .md h5, .md h6 { font-size: 1.05em; }
.md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; background: var(--btn); padding: 1px 4px; border-radius: 4px; }
.md pre { background: var(--btn); padding: 10px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
.md pre code { background: none; padding: 0; }
.md blockquote { border-left: 3px solid var(--line); margin-left: 0; padding-left: 12px; color: var(--muted); }
.md hr { border: none; border-top: 1px solid var(--line); margin: 6px 0; }
.md .table-wrap { overflow-x: auto; margin: 0 0 10px; }
.md table { border-collapse: collapse; font-size: 0.93em; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
.fake-link { color: var(--accent); text-decoration: underline; }
.u { cursor: pointer; border-radius: 4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; -webkit-tap-highlight-color: transparent; }
.u.on, tr.u.on td, tr.u.on th { background: var(--flag); color: var(--flag-ink); }
div.u.hr { padding: 8px 0; }
@media (hover: hover) { .u:hover { outline: 2px solid var(--flag); } }
.hint { font-size: 0.9rem; color: var(--muted); margin: 0 0 8px; }
.q { margin: 18px 0 6px; font-weight: 600; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.choices.four { grid-template-columns: repeat(2, 1fr); }
button { font: inherit; color: var(--ink); background: var(--btn); border: 1px solid var(--line); border-radius: 10px; min-height: 46px; padding: 8px 12px; cursor: pointer; }
button.sel { background: var(--on); color: var(--on-ink); border-color: var(--on); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
button.primary:disabled { opacity: 0.4; cursor: default; }
button.link { background: none; border: none; color: var(--accent); min-height: 0; padding: 4px 0; text-decoration: underline; }
.ends { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
.navbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
.navbar .inner { max-width: 700px; margin: 0 auto; display: flex; gap: 10px; }
.navbar .inner button { flex: 1; }
.navbar .inner button.back { flex: 0 0 30%; }
input[type=text], textarea { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
textarea { min-height: 90px; resize: vertical; }
.sessions { list-style: none; padding: 0; margin: 0; }
.sessions li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
.sessions li:last-child { border-bottom: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row button { flex: 1; }
.kbd { display: none; }
@media (hover: hover) and (pointer: fine) { .kbd { display: inline; font-size: 0.78rem; color: var(--muted); font-weight: 400; } }
</style>
</head>

<script>
var KIT = {"kit_id":"e7f31adc7a","rater":"","contact":"Jay","sessions":[{"id":"s1","blocks":[{"id":"s1b1","items":[{"id":"pt8shz","prompt":"what are some of the best and most reliable brands for side by side type refrigerators?","doc":[{"t":"p","lines":[[{"k":0,"r":"Here's a quick rundown based on long-term reliability reputation, repair technician opinions, and owner feedback:"}]]},{"t":"p","lines":[[{"k":1,"r":"**Most reliable picks**"}]]},{"t":"list","ordered":false,"items":[{"lines":[[{"k":2,"r":"**Whirlpool** (and its sister brands **KitchenAid** and **Maytag**): Often the top recommendation from repair technicians."},{"k":3,"r":"Simple, durable designs, and parts are cheap and easy to find."}]],"c":[]},{"lines":[[{"k":4,"r":"**GE** (including **GE Profile** and **Café**): Solid reliability, good features for the price, and a large service network."}]],"c":[]},{"lines":[[{"k":5,"r":"**Frigidaire**: Good value."},{"k":6,"r":"Fewer bells and whistles, but dependable basics."}]],"c":[]}]},{"t":"p","lines":[[{"k":7,"r":"**Feature-packed, but more mixed reliability**"}]]},{"t":"list","ordered":false,"items":[{"lines":[[{"k":8,"r":"**LG**: Great features (like Door-in-Door), good energy efficiency, and usually strong cooling performance."},{"k":9,"r":"However, some older models had well-publicized compressor failures, and the ice makers can be finicky."}]],"c":[]},{"lines":[[{"k":10,"r":"**Samsung**: Stylish with lots of tech, often at good prices, but it gets a lot of complaints about ice makers and customer service."},{"k":11,"r":"I'd be more cautious here."}]],"c":[]}]},{"t":"p","lines":[[{"k":12,"r":"**High-end/built-in**"}]]},{"t":"list","ordered":false,"items":[{"lines":[[{"k":13,"r":"**Sub-Zero**: Exceptional build quality and known for lasting 20+ years, but very expensive."},{"k":14,"r":"**Monogram** (GE's luxury line) is another premium built-in option."}]],"c":[]}]},{"t":"p","lines":[[{"k":15,"r":"**Tips for picking a reliable one**"}]]},{"t":"list","ordered":false,"items":[{"lines":[[{"k":16,"r":"**The ice maker and water dispenser are the most common failure points**, and side-by-sides almost always have them."},{"k":17,"r":"If you don't need fancy dispenser features, simpler is better."}]],"c":[]},{"lines":[[{"k":18,"r":"**Check local service.**"},{"k":19,"r":"A great fridge is a pain if no one nearby can fix it."},{"k":20,"r":"Whirlpool and GE are the easiest to get serviced in most areas."}]],"c":[]},{"lines":[[{"k":21,"r":"**Look at the specific model, not just the brand.**"},{"k":22,"r":"Reliability can vary a lot between models, so check recent reviews and Consumer Reports' reliability ratings."}]],"c":[]},{"lines":[[{"k":23,"r":"**Compare warranties,** especially on the compressor."},{"k":24,"r":"Some brands offer 10 years on it."}]],"c":[]}]},{"t":"p","lines":[[{"k":25,"r":"**Bottom line:** For the best odds of a trouble-free fridge, go with Whirlpool or GE."},{"k":26,"r":"Choose LG if you want more features, and Sub-Zero if budget isn't a concern."}]]}]},{"id":"86zy2n","prompt":"how to email customer that your shift will end on 16 sast so you will turnover the case or you will work for an extra hour to perform the action plan myself","doc":[{"t":"p","lines":[[{"k":0,"r":"Here's a clear, professional way to say it."},{"k":1,"r":"Use the first version if you want the customer to choose, or one of the shorter ones if you've already decided."}]]},{"t":"hr","u":{"k":2,"r":""}},{"t":"p","lines":[[{"k":3,"r":"**Option 1: Let the customer choose**"}]]},{"t":"p","lines":[[{"k":4,"r":"**Subject:** Case [number] – Next steps before end of shift"}]]},{"t":"p","lines":[[{"k":5,"r":"Dear [Customer Name],"}]]},{"t":"p","lines":[[{"k":6,"r":"I hope you're doing well."}]]},{"t":"p","lines":[[{"k":7,"r":"I wanted to let you know that my shift ends at 16:00 SAST today."},{"k":8,"r":"To make sure the action plan goes ahead without delay, there are two ways we can proceed:"}]]},{"t":"list","ordered":true,"items":[{"lines":[[{"k":9,"r":"**Hand over to a colleague:** I'll transfer the case to [colleague's name / our next-shift engineer], who will carry out the action plan with you."},{"k":10,"r":"I'll brief them fully, so you won't need to repeat any information."}]],"c":[]},{"lines":[[{"k":11,"r":"**I extend my shift by one hour:** I can stay until 17:00 SAST to perform the action plan with you myself, provided we can start by [time] SAST."}]],"c":[]}],"start":1},{"t":"p","lines":[[{"k":12,"r":"Please let me know which option you prefer."},{"k":13,"r":"If I don't hear back by [time] SAST, I'll hand the case over so the work can continue without interruption."}]]},{"t":"p","lines":[[{"k":14,"r":"Kind regards,"}],[{"k":15,"r":"[Your Name]"}],[{"k":16,"r":"[Job Title] | [Company]"}]]},{"t":"hr","u":{"k":17,"r":""}},{"t":"p","lines":[[{"k":18,"r":"**Option 2: You're handing the case over**"}]]},{"t":"p","lines":[[{"k":19,"r":"**Subject:** Case [number] – Handover to [Colleague's Name]"}]]},{"t":"p","lines":[[{"k":20,"r":"Dear [Customer Name],"}]]},{"t":"p","lines":[[{"k":21,"r":"Please note that my shift ends at 16:00 SAST today."},{"k":22,"r":"To keep things moving, I'm handing this case over to my colleague [Name], who will continue with the action plan."},{"k":23,"r":"I've shared all the details and our progress so far with them, so you won't need to repeat anything."}]]},{"t":"p","lines":[[{"k":24,"r":"[Colleague's Name] will be in touch [shortly / by time]."},{"k":25,"r":"Thank you for your understanding."}]]},{"t":"p","lines":[[{"k":26,"r":"Kind regards,"}],[{"k":27,"r":"[Your Name]"}]]},{"t":"hr","u":{"k":28,"r":""}},{"t":"p","lines":[[{"k":29,"r":"**Option 3: You're staying the extra hour**"}]]},{"t":"p","lines":[[{"k":30,"r":"**Subject:** Case [number] – Completing the action plan today"}]]},{"t":"p","lines":[[{"k":31,"r":"Dear [Customer Name],"}]]},{"t":"p","lines":[[{"k":32,"r":"My shift ends at 16:00 SAST today, but I'm happy to stay on for an extra hour, until 17:00 SAST, so I can carry out the action plan with you myself."}]]},{"t":"p","lines":[[{"k":33,"r":"Could you please confirm you're available to start at [time] SAST?"},{"k":34,"r":"If we can't finish by 17:00 SAST, I'll hand the case over to a colleague with full notes so there's no delay."}]]},{"t":"p","lines":[[{"k":35,"r":"Kind regards,"}],[{"k":36,"r":"[Your Name]"}]]},{"t":"hr","u":{"k":37,"r":""}},{"t":"p","lines":[[{"k":38,"r":"**Tip:** if the customer is in another time zone, add their local time too, e.g. \"16:00 SAST (14:00 UTC)\"."}]]}]},{"id":"znbth2","prompt":"trying to plan spring break w/ 2 kids (6 and 9), narrowed it down to 3 options:\n- lake cabin, 2 hr drive, $180/night, has kayaks + fire pit\n- beach condo, 6.5 hr drive, $245/night, pool and 10 min walk to the beach\n- fly to my sister's in Denver and stay with her for free, but 4 round trip tickets are ~$310 each (2.5 hr nonstop)\n\nit'd be 5 nights. can you make a table comparing total cost, travel time, stuff for the kids to do, and downsides? I keep going back and forth","doc":[{"t":"p","lines":[[{"k":0,"r":"Here's a side-by-side for 5 nights, 4 people:"}]]},{"t":"table","head":{"k":1,"r":"","cells":["","Lake cabin","Beach condo","Denver (sister's)"]},"rows":[{"k":2,"r":"","cells":["**Lodging**","$900","$1,225","$0"]},{"k":3,"r":"","cells":["**Getting there**","~$35 gas","~$110 gas","$1,240 (4 × $310)"]},{"k":4,"r":"","cells":["**Est. total**","**~$935**","**~$1,335**","**~$1,240+**"]},{"k":5,"r":"","cells":["**Travel time (each way)**","2 hrs","6.5 hrs (more like 7.5 with kid stops)","2.5 hr flight, but ~5–6 hrs door to door"]},{"k":6,"r":"","cells":["**Stuff for the kids**","Kayaking, fire pit and s'mores, exploring outdoors","Pool, beach, sandcastles, shell hunting","Time with their aunt, Denver's museums and zoo, maybe snow and mountains"]},{"k":7,"r":"","cells":["**Downsides**","Weather-dependent; not much to do on rainy days; lake probably too cold to swim","Longest drive (~13 hrs round trip); priciest lodging; pool and ocean may be chilly in spring","Flights wipe out the \"free\" savings; airport hassle with kids; less privacy as houseguests; may need a rental car; spring snow can disrupt flights"]}]},{"t":"p","lines":[[{"k":8,"r":"*Gas assumes ~25 mpg and ~$3.50/gallon.*"},{"k":9,"r":"*Not included: food, rental cleaning fees and taxes, or Denver extras like checked bags, airport parking, or a car.*"}]]},{"t":"p","lines":[[{"k":10,"r":"**A few things that might help you decide:**"}]]},{"t":"list","ordered":false,"items":[{"lines":[[{"k":11,"r":"**Denver isn't actually the budget option.**"},{"k":12,"r":"With flights, it costs about the same as the beach."},{"k":13,"r":"Pick it if seeing your sister is the main goal, not to save money."}]],"c":[]},{"lines":[[{"k":14,"r":"**The lake is the cheapest and lowest-stress,** about $300–400 less than the other two, with by far the shortest trip."},{"k":15,"r":"Kayaks and a fire pit are usually a hit with a 6- and 9-year-old."},{"k":16,"r":"The risk is weather: a few cold, rainy days in a cabin can get long."}]],"c":[]},{"lines":[[{"k":17,"r":"**The beach is the most \"vacation-y,\"** but 13 hours in the car takes a real bite out of a 5-night trip."}]],"c":[]}]},{"t":"p","lines":[[{"k":18,"r":"If you tell me roughly where you're starting from and when spring break is, I can help you think through the weather, which might be the tiebreaker."}]]}]},{"id":"9qhhkc","prompt":"What scripture should I read for the Hope candle for Advent?","doc":[{"t":"p","lines":[[{"k":0,"r":"The most popular choice for the Hope candle is **Isaiah 9:2, 6–7**:"}]]},{"t":"quote","c":[{"t":"p","lines":[[{"k":1,"r":"\"The people walking in darkness have seen a great light…"},{"k":2,"r":"For to us a child is born, to us a son is given…"},{"k":3,"r":"And he will be called Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace.\""}]]}]},{"t":"p","lines":[[{"k":4,"r":"It's a perfect fit: it points to the promised Messiah, and the image of light breaking into darkness matches lighting the first candle."},{"k":5,"r":"(Some churches call this first candle the \"Prophecy candle,\" which is why Old Testament prophecies are such a common choice.)"}]]},{"t":"p","lines":[[{"k":6,"r":"**Other great options:**"}]]},{"t":"list","ordered":false,"items":[{"lines":[[{"k":7,"r":"**Isaiah 40:31**: \"Those who hope in the Lord will renew their strength…\""}]],"c":[]},{"lines":[[{"k":8,"r":"**Jeremiah 33:14–16**: God's promise of a \"righteous Branch\" from David's line"}]],"c":[]},{"lines":[[{"k":9,"r":"**Isaiah 7:14**: the sign of Immanuel, \"God with us\""}]],"c":[]},{"lines":[[{"k":10,"r":"**Lamentations 3:21–23**: \"…therefore I have hope… great is your faithfulness\""}]],"c":[]},{"lines":[[{"k":11,"r":"**Psalm 130:5**: \"I wait for the Lord… and in his word I put my hope\""}]],"c":[]},{"lines":[[{"k":12,"r":"**Romans 15:13**: \"May the God of hope fill you with all joy and peace as you trust in him…\""}]],"c":[]}]},{"t":"p","lines":[[{"k":13,"r":"**A simple way to do it:** Read Isaiah 9:2, 6–7, light the candle, then close with Romans 15:13 as a prayer or blessing."}]]},{"t":"p","lines":[[{"k":14,"r":"If your church follows the Revised Common Lectionary, the readings for the first Sunday of Advent this year (Year B, November 29) are Isaiah 64:1–9, Psalm 80:1–7, 17–19, 1 Corinthians 1:3–9, and Mark 13:24–37."}]]},{"t":"p","lines":[[{"k":15,"r":"Want a short prayer to go with the candle lighting?"}]]}]}]},{"id":"s1b2","items":[{"id":"d49jvg","prompt":"What is the Korean character for the /Θ/ sound?","doc":[{"t":"p","lines":[[{"k":0,"r":"Korean doesn't have the /θ/ sound, so there's no Hangul letter for it."},{"k":1,"r":"The National Institute of Korean Language's loanword rules write English /θ/ as ㅅ, so \"thrill\" becomes 스릴 and \"health\" becomes 헬스."},{"k":2,"r":"In casual spelling you'll also see ㄸ, as in 땡큐 for \"thank you.\""}]]},{"t":"p","lines":[[{"k":3,"r":"The voiced sound /ð/, as in \"the,\" is usually written with ㄷ, as in 더 and 마더 (\"mother\")."}]]}]},{"id":"9h9su8","prompt":"Write a professional email on this  scenario \"Dear sir, i hope this email find you well, i want confirmation about my invoices from your side, did you send these invoices to finance for payment or not? if  you not sent yet kindly send as soon as possible or if you having any kind of query and question please let me know.\"","doc":[{"t":"p","lines":[[{"k":0,"r":"Subject: Request to confirm invoice submission to Finance"}]]},{"t":"p","lines":[[{"k":1,"r":"Dear Sir,"}]]},{"t":"p","lines":[[{"k":2,"r":"I hope this email finds you well."}]]},{"t":"p","lines":[[{"k":3,"r":"Could you please confirm whether the following invoices have been sent to Finance for payment?"}]]},{"t":"list","ordered":false,"items":[{"lines":[[{"k":4,"r":"Invoice [number], dated [date], for [amount]"}]],"c":[]},{"lines":[[{"k":5,"r":"Invoice [number], dated [date], for [amount]"}]],"c":[]}]},{"t":"p","lines":[[{"k":6,"r":"If they have not been sent yet, I would be grateful if you could forward them as soon as possible."},{"k":7,"r":"If you have any questions about them, please let me know."}]]},{"t":"p","lines":[[{"k":8,"r":"Best regards,"}],[{"k":9,"r":"[Your name]"}],[{"k":10,"r":"[Company]"}],[{"k":11,"r":"[Phone number]"}]]}]},{"id":"wmc9wd","prompt":"can you turn this into a quick slack update for my manager?\n\n- auth migration done for checkout flow\n- stripe webhooks throwing 500s randomly on staging (around 4% fail rate) -> marcos digging in today\n- android release pushed thurs -> next mon oct 19\n- blocker: still need sarahs signoff on privacy copy by tmrw eod","doc":[{"t":"p","lines":[[{"k":0,"r":"Quick update:"}]]},{"t":"list","ordered":false,"items":[{"lines":[[{"k":1,"r":"Auth migration is done for the checkout flow."}]],"c":[]},{"lines":[[{"k":2,"r":"Stripe webhooks are randomly throwing 500s on staging, about a 4% failure rate."},{"k":3,"r":"Marcos is digging in today."}]],"c":[]},{"lines":[[{"k":4,"r":"Android release is pushed from Thursday to next Monday, Oct 19."}]],"c":[]},{"lines":[[{"k":5,"r":"Blocker: I still need Sarah's sign-off on the privacy copy by EOD tomorrow."}]],"c":[]}]}]},{"id":"m7zrkx","prompt":"Need a product launch email. Pebble Route is releasing Homing Pebble, a gps collar for elderly cats who wander off. $129, ships November 3, battery lasts 8 days, uses the same app as our dog tracker. Send it to people who already bought the dog collar. Sign it Lila Chen. Casual, not a press release.","doc":[{"t":"p","lines":[[{"k":0,"r":"Subject: Now the cat gets one too"}]]},{"t":"p","lines":[[{"k":1,"r":"Hi [first name],"}]]},{"t":"p","lines":[[{"k":2,"r":"If there's an older cat at your place who tends to wander off, we made something for them."}]]},{"t":"p","lines":[[{"k":3,"r":"Homing Pebble is our new GPS collar built for senior cats."},{"k":4,"r":"It works in the same app you already use for your dog's collar, so you can keep track of both in one place."},{"k":5,"r":"The battery lasts 8 days on a charge."}]]},{"t":"p","lines":[[{"k":6,"r":"It's $129 and ships November 3."}]]},{"t":"p","lines":[[{"k":7,"r":"[Order Homing Pebble]"}]]},{"t":"p","lines":[[{"k":8,"r":"Thanks for trusting us with your dog."}]]},{"t":"p","lines":[[{"k":9,"r":"Lila Chen"}],[{"k":10,"r":"Pebble Route"}]]}]}]}]},{"id":"s2","blocks":[{"id":"s2b1","items":[{"id":"nmxj4y","prompt":"be straight with me. is it crucial that red kettle hot sauce has the trademark filed before we print 5,000 labels on thursday, or can i print and file next month? i'm rosa mendes. the llc is done. the domain is ours.","doc":[{"t":"p","lines":[[{"k":0,"r":"In the U.S., you can print labels before filing a trademark application, Rosa."},{"k":1,"r":"I wouldn't order 5,000 until you've checked for conflicting trademarks."}]]},{"t":"p","lines":[[{"k":2,"r":"Having the LLC and domain doesn't establish that Red Kettle is available for hot sauce."},{"k":3,"r":"Another business may have rights to a similar name, including through use without federal registration."},{"k":4,"r":"Filing an application won't erase those rights or guarantee approval."}]]},{"t":"p","lines":[[{"k":5,"r":"A clearance review should cover similar names for sauces and related products as well as exact matches."},{"k":6,"r":"If the name creates an infringement risk, you could end up scrapping the labels and rebranding."}]]},{"t":"p","lines":[[{"k":7,"r":"You can file an intent-to-use application before you start selling, so you don't need to wait for launch."},{"k":8,"r":"Waiting until next month could affect your filing priority."}]]},{"t":"p","lines":[[{"k":9,"r":"I'd get a trademark lawyer to review the name before Thursday and file promptly if the review supports it."},{"k":10,"r":"If that can't happen in time, delay the big print run."}]]}]},{"id":"seqmfe","prompt":"write a detailed paragraph on monolithic kernal vs microkernal based operating sysytems","doc":[{"t":"p","lines":[[{"k":0,"r":"The kernel is the privileged core of an operating system, responsible for managing hardware resources and supporting applications."},{"k":1,"r":"In a monolithic design, most core services, including process scheduling, memory management, file systems, networking, and many device drivers, run in kernel space and can call one another directly."},{"k":2,"r":"This often reduces communication overhead, but a faulty driver can corrupt kernel memory or crash the whole system."},{"k":3,"r":"Linux is generally classified as monolithic even though it supports loadable modules, because those modules still run in kernel space."},{"k":4,"r":"A microkernel keeps a smaller set of mechanisms in kernel space, typically scheduling, interprocess communication (IPC), and basic address-space management, while moving services such as file systems and many drivers into separate user-space processes."},{"k":5,"r":"These services exchange messages, which can improve fault isolation and allow some failed services to be restarted without rebooting."},{"k":6,"r":"Message passing and context switches can introduce overhead, though the implementation affects how much overhead there is."},{"k":7,"r":"A smaller privileged core can also be easier to audit, but the system’s security still depends on its other components and their permissions."},{"k":8,"r":"MINIX 3 and QNX use microkernel designs."},{"k":9,"r":"Windows NT and Apple’s XNU are commonly described as hybrid kernels because they combine features of monolithic and microkernel approaches."}]]}]},{"id":"azrhrr","prompt":"make this speaker bio punchy. has to fit a conference badge, under 40 words. andrea foss. helps mid-size hospitals fix the slow parts of discharge planning. previously at river ward hospital. lives in tulsa with two dogs.","doc":[{"t":"p","lines":[[{"k":0,"r":"Andrea Foss helps mid-size hospitals speed up discharge planning."},{"k":1,"r":"She previously worked at River Ward Hospital and lives in Tulsa with two dogs."}]]}]},{"id":"gejrm4","prompt":"How do I tell my teacher that I don't want to take the AP exam for her AP class? By the way, I'm a senior. She wants a reason.","doc":[{"t":"p","lines":[[{"k":0,"r":"Give her your reason without making up an excuse."},{"k":1,"r":"If you want to focus on your other senior-year commitments, you could say:"}]]},{"t":"p","lines":[[{"k":2,"r":"“I’ve decided not to take the AP exam this year."},{"k":3,"r":"I want to focus my remaining time on my other senior-year commitments rather than the extra exam preparation."},{"k":4,"r":"I’ll still complete the coursework and take the class assessments.”"}]]},{"t":"p","lines":[[{"k":5,"r":"Use that reason only if it’s true."},{"k":6,"r":"If the exam fee is the issue, or your intended college won’t give you useful credit for the score, say that instead."}]]},{"t":"p","lines":[[{"k":7,"r":"Check your school’s policy before making it final, since some schools require AP students to take the exam, and cancellation fees may apply."}]]}]}]},{"id":"s2b2","items":[{"id":"rr9afm","prompt":"I don't feel like writing these days...// One friend of Twitter wrote that 4 days ago .  I wanna start a conversation but send positive vibes as well. What should I write","doc":[{"t":"p","lines":[[{"k":0,"r":"You could send:"}]]},{"t":"quote","c":[{"t":"p","lines":[[{"k":1,"r":"Hey, just saw your tweet—how have you been?"},{"k":2,"r":"Hope the week’s been kind to you."},{"k":3,"r":"No pressure to write; just wanted to say hi and send some good vibes 💛"}]]}]},{"t":"p","lines":[[{"k":4,"r":"It gives them an opening to talk without making them explain why they haven’t been writing."}]]}]},{"id":"dendzf","prompt":"how do I make a voice in an audio sound like its moving as if someone is falling away from the microphone into a pit?","doc":[{"t":"p","lines":[[{"k":0,"r":"The trick is to make the voice become **quieter, darker and more echoey**, with a slight downward pitch glide."},{"k":1,"r":"A volume fade alone usually just sounds like someone turning down a recording."}]]},{"t":"p","lines":[[{"k":2,"r":"In your audio editor, automate these changes over roughly **2–3 seconds**:"}]]},{"t":"list","ordered":true,"items":[{"lines":[[{"k":3,"r":"**Fade the direct voice.**"},{"k":4,"r":"Start at its normal level and drop it by about **18–24 dB** as the person falls away."}]],"c":[]},{"lines":[[{"k":5,"r":"**Reduce the high frequencies.**"},{"k":6,"r":"Sweep a low-pass filter from around **12 kHz down to 2–4 kHz**."},{"k":7,"r":"This takes away the close, crisp sound."}]],"c":[]},{"lines":[[{"k":8,"r":"**Add a small pitch drop.**"},{"k":9,"r":"Try a downward glide of **1–3 semitones** to suggest a receding, accelerating source."},{"k":10,"r":"Keep it subtle; a large drop sounds more cartoonish than realistic."}]],"c":[]},{"lines":[[{"k":11,"r":"**Increase the sense of space.**"},{"k":12,"r":"Use a dark, cavern-like reverb with a **2–4-second decay**."},{"k":13,"r":"Let the dry voice fade more strongly than the reverberant sound, so you’re left hearing echoes from below."}]],"c":[]},{"lines":[[{"k":14,"r":"**Shape the movement.**"},{"k":15,"r":"Make the changes gentle at first, then faster, rather than using identical straight-line fades."},{"k":16,"r":"That helps suggest acceleration."}]],"c":[]}],"start":1},{"t":"p","lines":[[{"k":17,"r":"A quiet delay around **80–150 ms** can add pit-wall reflections, but keep it low enough that it doesn’t sound like an obvious repeated phrase."}]]},{"t":"p","lines":[[{"k":18,"r":"Put the reverb on a separate send/bus if possible, and **let its tail continue after the voice disappears**."},{"k":19,"r":"A brief air whoosh or a distant impact, if appropriate to the scene, can help sell the fall—but the fading direct voice and lingering echoes do most of the work."}]]}]},{"id":"6x5vjm","prompt":"Write for linkedIn profile in section About shortly and succinct about me and my profession. I am development manager in sales of chemicals and chemical raw materials for different markets","doc":[{"t":"p","lines":[[{"k":0,"r":"I’m a development manager specializing in sales of chemicals and chemical raw materials across diverse markets."},{"k":1,"r":"I focus on building strong customer relationships, identifying growth opportunities, and connecting customers with the right materials for their business needs."}]]}]},{"id":"cwtzte","prompt":"should burnt sugar lean into the name or change it? bakery, open 14 months. people remember it. a few of them think we burn the food. we don't. it's about the dessert with the torched top. yes or no, i don't have time for a brand workshop.","doc":[{"t":"p","lines":[[{"k":0,"r":"Yes—lean into it."},{"k":1,"r":"**Keep Burnt Sugar.**"},{"k":2,"r":"People remember it; a few misunderstandings aren’t worth a rebrand."},{"k":3,"r":"Put the torched-top dessert front and center so the name makes sense."}]]}]}]}]},{"id":"s3","blocks":[{"id":"s3b1","items":[{"id":"vnhasq","prompt":"My dishwasher has been broken for 3 weeks and my landlord keeps saying he'll \"get someone out\" and then nothing happens. Can you write two versions of a message to him, one formal I can email and keep for my records and one more casual for texting? I want to mention that the lease says appliance repairs are his responsibility (section 9) and ask him to confirm a repair date by this Friday. His name is Greg, I'm Priya in unit 4B.","doc":[{"t":"p","lines":[[{"k":0,"r":"Here are two versions you can use, depending on how you'd like to reach out:"}]]},{"t":"h","level":3,"u":{"k":1,"r":"Option 1: Formal Email (Recommended for creating a paper trail)"}},{"t":"p","lines":[[{"k":2,"r":"**Subject:** Repair Request: Dishwasher in Unit 4B – Section 9 Lease Responsibility"}]]},{"t":"p","lines":[[{"k":3,"r":"Hi Greg,"}]]},{"t":"p","lines":[[{"k":4,"r":"I am writing to follow up on the broken dishwasher in Unit 4B."},{"k":5,"r":"As you know, the unit has been completely out of service for three weeks now."}]]},{"t":"p","lines":[[{"k":6,"r":"While I appreciate your previous mentions that you would send someone out, we still do not have a repair scheduled."},{"k":7,"r":"Per **Section 9** of our lease agreement, maintenance and repairs of supplied appliances are the landlord's responsibility."},{"k":8,"r":"Going without a working dishwasher for this long has created a significant ongoing inconvenience."}]]},{"t":"p","lines":[[{"k":9,"r":"Please confirm a definite repair date with a technician by **this Friday, [Date]**."}]]},{"t":"p","lines":[[{"k":10,"r":"Thank you for your prompt attention to this matter."}]]},{"t":"p","lines":[[{"k":11,"r":"Best regards,"}],[{"k":12,"r":"Priya"}],[{"k":13,"r":"Unit 4B"}],[{"k":14,"r":"[Your Phone Number]"}]]},{"t":"hr","u":{"k":15,"r":""}},{"t":"h","level":3,"u":{"k":16,"r":"Option 2: Casual Text"}},{"t":"p","lines":[[{"k":17,"r":"Hi Greg, following up again on the dishwasher in 4B."},{"k":18,"r":"It’s been broken for 3 weeks now, and per Section 9 of the lease, appliance repairs are covered by management."},{"k":19,"r":"Could you please confirm a set date for someone to come fix it by this Friday?"},{"k":20,"r":"It’s getting really difficult to manage without it."},{"k":21,"r":"Thanks, Priya"}]]}]},{"id":"ng4z8k","prompt":"Give me 3 subject line options for an email inviting customers to a webinar about our new recurring invoices feature. We're Brindle Ledger (accounting software for small businesses). Webinar is Thursday Oct 22 at 1pm ET, 30 min with live Q&A at the end. Audience is mostly bookkeepers who already use us. Keep them under 50 characters and not too salesy.","doc":[{"t":"p","lines":[[{"k":0,"r":"Here are 3 clean, non-salesy options tailored for bookkeepers, all well under 50 characters:"}]]},{"t":"p","lines":[[{"k":1,"r":"**Option 1 (Direct & functional):**"}],[{"k":2,"r":"`New: Recurring invoices walkthrough` *(36 characters)*"}]]},{"t":"p","lines":[[{"k":3,"r":"**Option 2 (Benefit-driven for workflow):**"}],[{"k":4,"r":"`Automate client billing: Live walkthrough` *(42 characters)*"}]]},{"t":"p","lines":[[{"k":5,"r":"**Option 3 (Date-specific invite):**"}],[{"k":6,"r":"`Oct 22: Setting up recurring invoices` *(38 characters)*"}]]}]},{"id":"tdm47f","prompt":"make this sound professional for the client (Apex Retail):\n\n- sprint 4 deliverables: search filters & wishlist feature QA passed\n- payment gateway integration running 3 days behind bc sandbox api access took longer than expected\n- new target for staging handover: oct 24 instead of oct 21\n- need apex team to provide brand assets for receipts by friday\n- budget status: 142 of 200 hours used so far (on track)","doc":[{"t":"p","lines":[[{"k":0,"r":"Here is a professional version you can send to Apex Retail:"}]]},{"t":"hr","u":{"k":1,"r":""}},{"t":"p","lines":[[{"k":2,"r":"**Subject:** Project Status Update: Sprint 4 Deliverables & Staging Handover"}]]},{"t":"p","lines":[[{"k":3,"r":"Hi Team Apex,"}]]},{"t":"p","lines":[[{"k":4,"r":"Here is our latest update on current sprint progress, upcoming milestones, and action items:"}]]},{"t":"p","lines":[[{"k":5,"r":"**1.**"},{"k":6,"r":"**Sprint 4 Highlights**"}]]},{"t":"list","ordered":false,"items":[{"lines":[[{"k":7,"r":"**QA Sign-off:** Both Search Filters and the Wishlist feature have officially passed QA and are ready for release."}]],"c":[]}]},{"t":"p","lines":[[{"k":8,"r":"**2.**"},{"k":9,"r":"**Gateway Integration & Timeline Adjustment**"}]]},{"t":"list","ordered":false,"items":[{"lines":[[{"k":10,"r":"**Payment Gateway:** Integration is currently running 3 days behind schedule due to extended processing time required for sandbox API provisioning."}]],"c":[]},{"lines":[[{"k":11,"r":"**Revised Staging Date:** To ensure full end-to-end testing of the payment workflow, we have adjusted our target staging handover date from **October 21 to October 24**."}]],"c":[]}]},{"t":"p","lines":[[{"k":12,"r":"**3.**"},{"k":13,"r":"**Action Items for Apex**"}]]},{"t":"list","ordered":false,"items":[{"lines":[[{"k":14,"r":"**Receipt Brand Assets:** Please provide the finalized brand assets for digital receipts by **this Friday, [Date]**, so our team can incorporate them without impacting the updated release date."}]],"c":[]}]},{"t":"p","lines":[[{"k":15,"r":"**4.**"},{"k":16,"r":"**Budget & Resourcing**"}]]},{"t":"list","ordered":false,"items":[{"lines":[[{"k":17,"r":"**Budget Status:** We have utilized **142 of our 200 allocated hours** to date, and project spend remains healthy and on track."}]],"c":[]}]},{"t":"p","lines":[[{"k":18,"r":"Please let us know if you have any questions or need further details."}]]},{"t":"p","lines":[[{"k":19,"r":"Best regards,"}],[{"k":20,"r":"[Your Name / Team]"}]]}]},{"id":"4nvzcf","prompt":"scholarship letter for my niece lila owens, about 200 words. the prompt wants a testament to leadership. what she actually did was restock the community fridge at the eastside library every week for a year and not tell anyone. can you keep that tension instead of turning her into a club president?","doc":[{"t":"p","lines":[[{"k":0,"r":"Dear Scholarship Committee,"}]]},{"t":"p","lines":[[{"k":1,"r":"Most definitions of student leadership focus on visibility: elected titles, committee gavels, or polished presentations."},{"k":2,"r":"Lila Owens’s leadership operates on a different, far more demanding standard: quiet, unprompted responsibility when nobody is watching."}]]},{"t":"p","lines":[[{"k":3,"r":"For an entire year, Lila took it upon herself to restock the community fridge outside the Eastside Library every single week."},{"k":4,"r":"She did not establish a club to delegate the work, nor did she post about it on social media or request community service hours."},{"k":5,"r":"Instead, she quietly collected food donations, purchased shelf-stable staples with her own earnings, and reliably showed up in summer heat and winter rain to ensure that neighborhood families who depend on that pantry found clean shelves and fresh groceries."}]]},{"t":"p","lines":[[{"k":6,"r":"True leadership is not measured by the applause one commands, but by the weight one is willing to carry without expectation of praise."},{"k":7,"r":"When the novelty of volunteering wore off into a repetitive weekly chore, Lila remained accountable simply because people were hungry and she had made an unspoken commitment to them."}]]},{"t":"p","lines":[[{"k":8,"r":"That steady, humble integrity is rare in a student of any age."},{"k":9,"r":"I have no doubt Lila will bring that same enduring character and quiet strength to your campus community."}]]},{"t":"p","lines":[[{"k":10,"r":"Sincerely,"}]]},{"t":"p","lines":[[{"k":11,"r":"[Your Name]"}],[{"k":12,"r":"[Your Title/Relationship]"}]]}]}]},{"id":"s3b2","items":[{"id":"myfkk7","prompt":"I organize a Saturday morning running group (about 30 people in the group chat) and need to announce a few changes:\n- starting Nov 7 we're moving from 7am to 8am for the winter\n- meeting spot moves from the library steps to the Hollis Creek Park pavilion because of the construction\n- adding a 3 mile no-drop group alongside the usual 5 and 8 mile groups\n- reflective vest or a light required from now until March\n\nCan you write the announcement with a TL;DR line at the very top? Half of them only read the first line lol. Friendly, not too long.","doc":[{"t":"p","lines":[[{"k":0,"r":"TL;DR: Starting November 7, we meet at 8:00 AM at the Hollis Creek Park pavilion, reflective gear is required through March, and we are adding a 3-mile group."}]]},{"t":"p","lines":[[{"k":1,"r":"Hey everyone, a few updates for our Saturday runs as we head into winter:"}]]},{"t":"list","ordered":false,"items":[{"lines":[[{"k":2,"r":"Starting November 7, our start time moves from 7:00 AM to 8:00 AM."}]],"c":[]},{"lines":[[{"k":3,"r":"Because of library construction, our meeting spot moves to the Hollis Creek Park pavilion."}]],"c":[]},{"lines":[[{"k":4,"r":"We are adding a 3-mile no-drop group alongside our regular 5-mile and 8-mile groups."}]],"c":[]},{"lines":[[{"k":5,"r":"A reflective vest or running light is required from now through March."}]],"c":[]}]},{"t":"p","lines":[[{"k":6,"r":"See you Saturday at the pavilion."}]]}]},{"id":"x3uy6b","prompt":"how to change the climate in my bedroom for better sleep","doc":[{"t":"p","lines":[[{"k":0,"r":"Set your thermostat between 60 and 67 degrees Fahrenheit."},{"k":1,"r":"Cooler room temperatures help your body shed heat as you fall asleep."}]]},{"t":"p","lines":[[{"k":2,"r":"Keep air moving with a quiet fan or an open window."},{"k":3,"r":"Good airflow prevents carbon dioxide from concentrating around your bed and keeps the room from feeling stuffy."}]]},{"t":"p","lines":[[{"k":4,"r":"Keep humidity between 30% and 50%."},{"k":5,"r":"A humidifier prevents dry air from irritating your nose and throat in winter, and a dehumidifier stops mugginess in summer."}]]},{"t":"p","lines":[[{"k":6,"r":"Switch to bedding made of cotton or linen."},{"k":7,"r":"Layer light blankets instead of using one heavy synthetic comforter so you can adjust your warmth during the night."}]]}]},{"id":"8h7ujm","prompt":"Please correct the grammar: Only our store & warehouse have the supplies. Actually our scaffolder might also  have supply since they are using that. Unfortunately, they already left.","doc":[{"t":"p","lines":[[{"k":0,"r":"\"Only our store and warehouse have the supplies."},{"k":1,"r":"Our scaffolders might also have some, since they were using them, but unfortunately they have already left.\""}]]},{"t":"p","lines":[[{"k":2,"r":"A few adjustments:"}]]},{"t":"list","ordered":false,"items":[{"lines":[[{"k":3,"r":"\"Scaffolder\" is changed to \"scaffolders\" to match the plural pronoun \"they.\""}]],"c":[]},{"lines":[[{"k":4,"r":"\"Supply\" and \"that\" are changed to \"some\" and \"them\" to match plural \"supplies.\""}]],"c":[]},{"lines":[[{"k":5,"r":"\"Are using\" is changed to \"were using\" to match the fact that they have already left."}]],"c":[]},{"lines":[[{"k":6,"r":"The ampersand is spelled out as \"and.\""}]],"c":[]}]}]},{"id":"5rrx7a","prompt":"Write a thought-leadership post about AI at work for our firm blog, about 400 words. Ledger & Elm is a 40-person accounting firm in Des Moines. Byline: Rachel Nguyen, ops director. Staff may use a writing assistant for first drafts of client emails. They may not use it on anything that touches numbers. We've worked that way for six months.","doc":[{"t":"p","lines":[[{"k":0,"r":"Byline: Rachel Nguyen, Operations Director"}]]},{"t":"p","lines":[[{"k":1,"r":"Six months ago, Ledger & Elm set a simple rule for generative AI across our 40-person team in Des Moines: staff can use writing tools to draft client emails, but nobody uses them on anything involving numbers."}]]},{"t":"p","lines":[[{"k":2,"r":"At the time, industry coverage focused heavily on automated audits and returns prepared by software in seconds."},{"k":3,"r":"We took a narrower path."},{"k":4,"r":"Our clients trust us with their financial records, tax filings, and compliance."},{"k":5,"r":"That work requires verified data and professional judgment."},{"k":6,"r":"Large language models frequently invent figures, misapply tax regulations, and miss context in financial statements."},{"k":7,"r":"Putting client numbers into external tools also creates unnecessary data privacy questions."},{"k":8,"r":"So we kept numbers off limits."}]]},{"t":"p","lines":[[{"k":9,"r":"Where we saw immediate value was in daily correspondence."},{"k":10,"r":"CPAs and staff accountants spend hours every week drafting routine messages: requesting missing documents, explaining filing deadlines, or summarizing work that has already been completed."},{"k":11,"r":"Writing from a blank screen takes time, especially during tax season."}]]},{"t":"p","lines":[[{"k":12,"r":"We told our team they could use AI tools to generate first drafts of these emails."},{"k":13,"r":"The workflow is simple."},{"k":14,"r":"An accountant types out the points they want to make, asks the tool to turn those points into a draft, and then edits the output before sending."},{"k":15,"r":"No client names, account numbers, or dollar amounts go into the prompt."},{"k":16,"r":"The sender remains entirely responsible for every sentence."}]]},{"t":"p","lines":[[{"k":17,"r":"After six months, this boundary works well."},{"k":18,"r":"Staff spend less time staring at blank email windows when following up with clients."},{"k":19,"r":"Drafts get written faster, which gives our team more time for analysis, review, and client conversations."},{"k":20,"r":"We have also avoided calculation errors because the software never touches our work papers or tax software."}]]},{"t":"p","lines":[[{"k":21,"r":"Mid-sized firms often feel pressure to either adopt every new tool or ban the technology completely."},{"k":22,"r":"Drawing a firm line between drafting text and handling client numbers gave our team practical efficiency while protecting the accuracy our clients expect."}]]}]}]}]},{"id":"s4","blocks":[{"id":"s4b1","items":[{"id":"58x3xn","prompt":"can u write this up for the parents newsletter?\n\nroom 4b weekly notes:\n- finished solar system dioramas this week, kids did awesome!\n- library day moving from tues to wed starting next week\n- field trip to whispering pines nature center is thurs oct 22\n- still need 3 parent chaperones for the trip, permission slips due fri oct 16\n- please make sure students bring outdoor sneakers on thursdays for p.e.","doc":[{"t":"p","lines":[[{"k":0,"r":"Room 4B"}]]},{"t":"p","lines":[[{"k":1,"r":"We finished our solar system dioramas this week."},{"k":2,"r":"The kids did a great job."}]]},{"t":"p","lines":[[{"k":3,"r":"Starting next week, library day moves from Tuesday to Wednesday."}]]},{"t":"p","lines":[[{"k":4,"r":"Our field trip to Whispering Pines Nature Center is Thursday, October 22."},{"k":5,"r":"Permission slips are due Friday, October 16."},{"k":6,"r":"We still need three parent chaperones."},{"k":7,"r":"Please let me know if you can come."}]]},{"t":"p","lines":[[{"k":8,"r":"Please send your student in outdoor sneakers on Thursdays for P.E."}]]}]},{"id":"kef4ps","prompt":"can u walk me thru solving 2x^2 + 12x - 14 = 0 by completeing the square? numbered steps pls, my teacher takes points off if we skip steps and i alwyas mess up when theres a number in front of the x^2","doc":[{"t":"p","lines":[[{"k":0,"r":"Start with 2x² + 12x - 14 = 0."}]]},{"t":"list","ordered":true,"items":[{"lines":[[{"k":1,"r":"Add 14 to both sides so the constant leaves the left side."}]],"c":[]}],"start":1},{"t":"p","lines":[[{"k":2,"r":"2x² + 12x - 14 + 14 = 0 + 14"}],[{"k":3,"r":"2x² + 12x = 14"}]]},{"t":"list","ordered":true,"items":[{"lines":[[{"k":4,"r":"Divide every term by 2, including the right side."},{"k":5,"r":"Completing the square needs the x² term to have a coefficient of 1, and this is the step that removes the number in front of x²."}]],"c":[]}],"start":2},{"t":"p","lines":[[{"k":6,"r":"2x²/2 + 12x/2 = 14/2"}],[{"k":7,"r":"x² + 6x = 7"}]]},{"t":"list","ordered":true,"items":[{"lines":[[{"k":8,"r":"Take the coefficient of x, which is 6."}]],"c":[]},{"lines":[[{"k":9,"r":"Divide that coefficient by 2."}]],"c":[]}],"start":3},{"t":"p","lines":[[{"k":10,"r":"6/2 = 3"}]]},{"t":"list","ordered":true,"items":[{"lines":[[{"k":11,"r":"Square the result."}]],"c":[]}],"start":5},{"t":"p","lines":[[{"k":12,"r":"3² = 9"}]]},{"t":"list","ordered":true,"items":[{"lines":[[{"k":13,"r":"Add 9 to both sides."}]],"c":[]}],"start":6},{"t":"p","lines":[[{"k":14,"r":"x² + 6x + 9 = 7 + 9"}],[{"k":15,"r":"x² + 6x + 9 = 16"}]]},{"t":"list","ordered":true,"items":[{"lines":[[{"k":16,"r":"Factor the left side. (x + 3)² = x² + 6x + 9, so"}]],"c":[]}],"start":7},{"t":"p","lines":[[{"k":17,"r":"(x + 3)² = 16"}]]},{"t":"list","ordered":true,"items":[{"lines":[[{"k":18,"r":"Take the square root of both sides."},{"k":19,"r":"Keep both the positive and the negative root."}]],"c":[]}],"start":8},{"t":"p","lines":[[{"k":20,"r":"x + 3 = ±4"}]]},{"t":"list","ordered":true,"items":[{"lines":[[{"k":21,"r":"Split that into two equations."}]],"c":[]}],"start":9},{"t":"p","lines":[[{"k":22,"r":"x + 3 = 4 or x + 3 = -4"}]]},{"t":"list","ordered":true,"items":[{"lines":[[{"k":23,"r":"Subtract 3 from both sides of each equation."}]],"c":[]}],"start":10},{"t":"p","lines":[[{"k":24,"r":"x = 1 or x = -7"}]]},{"t":"list","ordered":true,"items":[{"lines":[[{"k":25,"r":"Check both in the original equation."}]],"c":[]}],"start":11},{"t":"p","lines":[[{"k":26,"r":"x = 1: 2(1)² + 12(1) - 14 = 2 + 12 - 14 = 0"}],[{"k":27,"r":"x = -7: 2(-7)² + 12(-7) - 14 = 98 - 84 - 14 = 0"}]]},{"t":"p","lines":[[{"k":28,"r":"Both check."},{"k":29,"r":"The solutions are x = 1 and x = -7."}]]}]},{"id":"tfrrqj","prompt":"rewrite the following with more transition words: Elevate your online presence with our exceptional web design services at Webnificent.  We are dedicated to crafting visually stunning and user-friendly bespoke websites tailored to meet your unique business needs. Webnificent seamlessly integrates cutting-edge design, intuitive navigation, and responsive functionality to ensure an engaging user experience across all devices.","doc":[{"t":"p","lines":[[{"k":0,"r":"Elevate your online presence with our exceptional web design services at Webnificent."},{"k":1,"r":"In particular, we are dedicated to crafting visually stunning and user-friendly bespoke websites, so they meet your unique business needs."},{"k":2,"r":"Furthermore, Webnificent seamlessly integrates cutting-edge design, intuitive navigation, and responsive functionality."},{"k":3,"r":"As a result, the experience stays engaging across all devices."}]]}]},{"id":"av8s2s","prompt":"I'm envious of my best friend because she is effortlessly pretty. What should I do to stop feeling this way?","doc":[{"t":"p","lines":[[{"k":0,"r":"You can't turn this off by deciding to."},{"k":1,"r":"Catch it when it starts, usually when you're looking at her and ranking yourself."},{"k":2,"r":"Close the photos when that happens."},{"k":3,"r":"It tends to ease when you're actually with her, and it gets louder when she's only a picture."},{"k":4,"r":"If it starts changing how you treat her, tell her, or step back from the posts for a while."}]]}]}]},{"id":"s4b2","items":[{"id":"fyewzh","prompt":"hey help me draft our weekly team email from these rough notes:\n\nteam update week of oct 12:\n- data pipeline v2 backfill 80% done, ETA wednesday night\n- latency down from 420ms -> 185ms on query endpoint\n- hiring: 3 onsite interviews next week for senior backend role\n- reminder: all hands moved to 2pm friday due to product demo\n- pls submit q3 expense reports before oct 16 deadline or finance locks them","doc":[{"t":"p","lines":[[{"k":0,"r":"Subject: Team update, week of Oct 12"}]]},{"t":"p","lines":[[{"k":1,"r":"Hi everyone,"}]]},{"t":"p","lines":[[{"k":2,"r":"A few notes for the week:"}]]},{"t":"p","lines":[[{"k":3,"r":"The data pipeline v2 backfill is about 80% done."},{"k":4,"r":"ETA is Wednesday night."},{"k":5,"r":"I'll send a note if that slips."}]]},{"t":"p","lines":[[{"k":6,"r":"Latency on the query endpoint is down from 420ms to 185ms."},{"k":7,"r":"That's the number we've been after."}]]},{"t":"p","lines":[[{"k":8,"r":"Hiring: three onsite interviews next week for the senior backend role."},{"k":9,"r":"If you're on a panel, check your calendar now so we aren't sorting it out Monday."}]]},{"t":"p","lines":[[{"k":10,"r":"All-hands is moved to 2pm Friday because of the product demo."},{"k":11,"r":"Same meeting, later start."}]]},{"t":"p","lines":[[{"k":12,"r":"Please submit Q3 expense reports before the October 16 deadline."},{"k":13,"r":"Finance locks them after that."}]]},{"t":"p","lines":[[{"k":14,"r":"Reply if I missed something."}]]}]},{"id":"tpde6v","prompt":"Write a conference talk abstract for a 25-minute session. Audience is city parks staff. I run maintenance for the Reedhaven parks department. We stopped mowing 42 acres of roadside, measured what grew back, and took criticism at city council. Speaker is June Padilla. Suggest a title too.","doc":[{"t":"p","lines":[[{"k":0,"r":"Title I'd use: **The 42 Acres We Stopped Mowing**"}]]},{"t":"p","lines":[[{"k":1,"r":"If the program has room for a sharper one, and you're comfortable with council seeing it: **What We Brought to Council After We Stopped Mowing**"}]]},{"t":"p","lines":[[{"k":2,"r":"Abstract:"}]]},{"t":"p","lines":[[{"k":3,"r":"Parks crews are being told to mow less and spend less, and then to explain, at a microphone, why the roadside looks different."},{"k":4,"r":"Those requests only coexist if someone measured something."}]]},{"t":"p","lines":[[{"k":5,"r":"Reedhaven's maintenance team took 42 acres of roadside off the mowing cycle."},{"k":6,"r":"Not as a pilot with a slogan."},{"k":7,"r":"The acres were marked, left, and measured for what grew back."},{"k":8,"r":"The criticism showed up where it usually does: city council, taller grass, sightlines, and the question of whether maintenance had stopped doing the job."}]]},{"t":"p","lines":[[{"k":9,"r":"This is a 25-minute session for people who run crews, not a design talk."},{"k":10,"r":"June Padilla, who leads maintenance for the Reedhaven parks department, will cover why those acres were chosen, what was measured, how those measurements were used when council pushed back, and what she would repeat or drop if another department cut a mowing cycle the same way."},{"k":11,"r":"She won't argue that every roadside should be a meadow."},{"k":12,"r":"She will argue that you should not arrive at that microphone without numbers."}]]},{"t":"p","lines":[[{"k":13,"r":"Bring the question your council is already asking."},{"k":14,"r":"The session is built for it."}]]}]},{"id":"7unf7n","prompt":"delve a little, not a whole history of cookware. my cast iron goes orange after tomato sauce even when i oil it warm. hearth & mill, 12 inch, three years of normal weeknight use. is the pan finished or is it the acid?","doc":[{"t":"p","lines":[[{"k":0,"r":"It's the acid."},{"k":1,"r":"The pan isn't finished."}]]},{"t":"p","lines":[[{"k":2,"r":"Tomato sauce is acidic enough to eat the seasoned layer, especially a weeknight sauce that sits and simmers."},{"k":3,"r":"Once that thin polymer is gone you're looking at bare iron, and bare iron plus any leftover moisture goes orange."},{"k":4,"r":"That's flash rust, not the seasoning changing color."},{"k":5,"r":"Oiling it warm afterward is the right cleanup."},{"k":6,"r":"It does not protect the pan during the cook."},{"k":7,"r":"By the time you wipe it, the damage is done."}]]},{"t":"p","lines":[[{"k":8,"r":"Three years of normal use on a Hearth & Mill 12-inch is nothing."},{"k":9,"r":"A pan is done when it's cracked, badly warped, or pitted so deep a new season won't hold."},{"k":10,"r":"Orange after marinara isn't that."},{"k":11,"r":"The iron underneath is almost certainly fine."}]]},{"t":"p","lines":[[{"k":12,"r":"Scrub the orange off until the metal looks gray again."},{"k":13,"r":"Salt, or a non-scratch pad, is enough if it's only surface rust."},{"k":14,"r":"Dry it on a burner until there's no moisture left at all, then wipe on a very thin coat of oil and heat it until it stops smoking."},{"k":15,"r":"If the orange is back the next morning, it was still damp, or the oil went on too thick and never bonded."},{"k":16,"r":"One oven cycle will put a real base back: thin oil, upside down, about an hour around 450°F, then let it cool in the oven."}]]},{"t":"p","lines":[[{"k":17,"r":"After that, keep long tomato, wine, and vinegar cooks in something else, or accept that you'll be reseasoning every time."},{"k":18,"r":"A quick sear is fine."},{"k":19,"r":"A pot of sauce is what strips it."},{"k":20,"r":"The pan isn't done."},{"k":21,"r":"The sauce is just rude to cast iron."}]]}]},{"id":"uhdc8g","prompt":"what should I do as a software engineer if my project manager doesn't know his business and disturbs me?","doc":[{"t":"p","lines":[[{"k":0,"r":"Treat it as a delivery problem, not a verdict on him."},{"k":1,"r":"A project manager who doesn't know the business will keep spending your afternoon on his uncertainty unless you change how the two of you work."}]]},{"t":"p","lines":[[{"k":2,"r":"When he interrupts, don't solve it standing there."},{"k":3,"r":"Ask what decision he needs, and by when."},{"k":4,"r":"If he can't answer, that's the fact."},{"k":5,"r":"Tell him you'll come back with options at a set time, and return to the work."},{"k":6,"r":"\"I'll pick this up at 3 unless it's blocking a release today\" is a full answer."},{"k":7,"r":"Use it."}]]},{"t":"p","lines":[[{"k":8,"r":"Write the gap down without making it a trial."},{"k":9,"r":"A short note is enough: who this is for, what done looks like, what you're assuming, and two or three options with the cost of each."},{"k":10,"r":"Ask him to pick."},{"k":11,"r":"Someone who can't write a spec can often still choose."},{"k":12,"r":"If he won't choose, send the assumption you're going to use and the time you'll start."},{"k":13,"r":"That is what protects you when the story changes on Thursday."}]]},{"t":"p","lines":[[{"k":14,"r":"Get the random questions out of your face."},{"k":15,"r":"A doc or a channel for anything that isn't urgent, plus one office hour, will catch a lot of this."},{"k":16,"r":"Dropping by feels useful to him."},{"k":17,"r":"It is expensive for you."},{"k":18,"r":"You can say that without a speech."}]]},{"t":"p","lines":[[{"k":19,"r":"Loop your own manager in with incidents, not labels."},{"k":20,"r":"\"Six interruptions yesterday, and the ticket still has no acceptance criteria\" can be acted on."},{"k":21,"r":"\"He doesn't know his business\" gets waved off."},{"k":22,"r":"Ask which gaps you are supposed to cover and which ones he owns."},{"k":23,"r":"Otherwise you become the unpaid PM and still wear the schedule."}]]},{"t":"p","lines":[[{"k":24,"r":"There is a difference between someone learning the domain and someone who won't learn, rewrites what was agreed, and uses your focus as scratch paper."},{"k":25,"r":"Help the first one for a limited time."},{"k":26,"r":"Escalate the second."},{"k":27,"r":"If you've made the process visible and it doesn't change, it is reasonable to say you can't keep estimating work that has no stable problem."}]]},{"t":"p","lines":[[{"k":28,"r":"You don't have to pretend the interruptions are fine."},{"k":29,"r":"You do have to make the cost specific enough that a fair manager can do something with it."}]]}]}]}]}]};
(function () {

  var VERSION = 1;
  var main = document.getElementById('app');
  var CONTACT = (KIT && KIT.contact) || 'the person who sent you this';

  // ------------------------------------------------------------ markdown
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
    });

    s = s.replace(/\[([^\]\n]+)\]\(([^)\n]+)\)/g, '<span class="fake-link">$1</span>');
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
    s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
    s = s.replace(/(^|[^*])\*([^*\s](?:[^*\n]*[^*\s])?)\*/g, '$1<em>$2</em>');
    s = s.replace(/(^|[^\w])_([^_\s](?:[^_\n]*[^_\s])?)_(?=$|[^\w])/g, '$1<em>$2</em>');
    return s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return code[Number(i)]; });
  }
  function plainMarkdown(src) {
    var lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
    var out = [], para = [], list = null;
    function flushPara() { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } }
    function flushList() { if (list) { out.push('<' + list.tag + '>' + list.items.map(function (t) { return '<li>' + inline(t) + '</li>'; }).join('') + '</' + list.tag + '>'); list = null; } }
    lines.forEach(function (line) {
      var m = /^\s*([-*+]|\d+[.)])\s+(.*)$/.exec(line);
      if (!line.trim()) { flushPara(); flushList(); return; }
      if (m) {
        flushPara();
        var tag = /\d/.test(m[1]) ? 'ol' : 'ul';
        if (!list || list.tag !== tag) { flushList(); list = {tag: tag, items: []}; }
        list.items.push(m[2]);
        return;
      }
      flushList();
      para.push(line.replace(/^#{1,6}\s+/, ''));
    });
    flushPara(); flushList();
    return out.join('');
  }
  function unitSpan(u) { return '<span class="u" data-u="' + u.k + '">' + inline(u.r) + '</span>'; }
  function renderLines(lines) {
    return lines.map(function (line) { return line.map(unitSpan).join(' '); }).join('<br>');
  }
  function renderDoc(blocks) { return blocks.map(renderBlock).join(''); }
  function renderBlock(b) {
    switch (b.t) {
      case 'p': return '<p>' + renderLines(b.lines) + '</p>';
      case 'h': return '<h' + b.level + '>' + unitSpan(b.u) + '</h' + b.level + '>';
      case 'hr': return '<div class="u hr" data-u="' + b.u.k + '"><hr></div>';
      case 'code': return '<pre class="u" data-u="' + b.u.k + '"><code>' + esc(b.u.r) + '</code></pre>';
      case 'quote': return '<blockquote>' + renderDoc(b.c) + '</blockquote>';
      case 'table':
        var row = function (u, cell) {
          return '<tr class="u" data-u="' + u.k + '">' + u.cells.map(function (c) { return '<' + cell + '>' + inline(c) + '</' + cell + '>'; }).join('') + '</tr>';
        };
        return '<div class="table-wrap"><table><thead>' + row(b.head, 'th') + '</thead><tbody>' + b.rows.map(function (u) { return row(u, 'td'); }).join('') + '</tbody></table></div>';
      case 'list':
        var tag = b.ordered ? 'ol' : 'ul';
        var start = b.ordered && b.start && b.start !== 1 ? ' start="' + b.start + '"' : '';

  }

  // ------------------------------------------------------------ state
  var KEY = 'pv-rating:' + KIT.kit_id;

  var state = load() || {rater: KIT.rater || '', s: {}};

  }
  function sessionIndex(id) { for (var i = 0; i < KIT.sessions.length; i++) if (KIT.sessions[i].id === id) return i; return -1; }

  function nextSession() {

  function results() {

      out.sessions[sess.id] = {start: st.start, end: st.end, p: st.p, n: st.n, blocks: st.blocks, items: st.items};

  // ------------------------------------------------------------ timing

  function wireChoices(root, onPick) {

  function home() {

    var anyDone = KIT.sessions.some(function (s) { return state.s[s.id] && state.s[s.id].end; });
    var list = KIT.sessions.map(function (s, i) {

      return '<li><span>Session ' + (i + 1) + '</span><span class="muted">' + status + '</span></li>';
    }).join('');
    main.innerHTML =
      '<h1>Reading test</h1>' +
      '<p>Thanks for helping. Each session takes about 10 minutes. You\'ll read 8 replies an AI wrote to messages people sent it, in two batches of four.</p>' +
      '<div class="card"><div class="label">For each reply</div>' +
      '<p>Tap any sentence that bugs you. Tap it again to undo.</p>' +
      '<p>Then say how tiring it was to read, and whether it would do the job.</p>' +
      '<p class="muted small">After each batch you\'ll say how worn out it left you, and at the end which batch you\'d rather keep getting. There are no right answers. Read the way you normally would, skimming included.</p></div>' +
      '<div class="card"><div class="label">Your name</div><input type="text" id="name" autocomplete="given-name" value="' + esc(state.rater) + '" placeholder="First name"></div>' +
      '<div class="card"><div class="label">Sessions</div><ul class="sessions">' + list + '</ul>' +
      (anyDone ? '<p class="small" style="margin-top:10px"><button class="link" id="send">Send your results</button></p>' : '') + '</div>' +
      (canSave ? '' : '<div class="banner">This browser isn\'t saving progress, so finish each session in one go.</div>') +
      '<p class="small muted"><button class="link" id="reset">Start over</button> (deletes your answers in this browser)</p>';
    var name = document.getElementById('name');
    name.addEventListener('input', function () {
      state.rater = name.value.trim();
      save();
      var b = document.getElementById('start');
      if (b && nxt) b.disabled = !state.rater;
    });
    if (anyDone) document.getElementById('send').addEventListener('click', function () { done(null); });
    document.getElementById('reset').addEventListener('click', function () {
      if (window.confirm('Delete all your answers in this browser and start over?')) {
        state = {rater: KIT.rater || '', s: {}};
        save();
        home();
      }
    });
    if (nxt) {
      var started = state.s[nxt.id] && state.s[nxt.id].start;
      setNav([{label: (started ? 'Continue' : 'Start') + ' session ' + (sessionIndex(nxt.id) + 1), cls: 'primary', id: 'start', disabled: !state.rater, onClick: function () {
        if (!state.rater) return;
        var st = sstate(nxt.id);
        if (!st.start) st.start = new Date().toISOString();
        save();
        show(nxt);
      }}]);
    } else {
      setNav([{label: 'Send your results', cls: 'primary', id: 'start', onClick: function () { done(null); }}]);
    }
  }

  function show(session) {
    var st = sstate(session.id);
    var all = steps(session);
    var step = all[Math.min(st.step, all.length - 1)];
    if (step.kind === 'item') itemScreen(session, st, step);
    else if (step.kind === 'block') blockScreen(session, st, step);
    else endScreen(session, st);
  }
  function go(session, delta) {
    var st = sstate(session.id);
    stopTimer();
    st.step = Math.max(0, st.step + delta);
    save();
    window.scrollTo(0, 0);
    show(session);
  }

  function itemScreen(session, st, step) {
    var block = session.blocks[step.b];
    var item = block.items[step.i];
    var rec = st.items[item.id] || (st.items[item.id] = {f: [], t: null, j: null, ms: 0});
    var nb = session.blocks.length;
    var dots = block.items.map(function (_, i) { return '<span class="' + (i < step.i ? 'done' : i === step.i ? 'now' : '') + '"></span>'; }).join('');
    var mins = st.start ? (Date.now() - Date.parse(st.start)) / 60000 : 0;
    var longPrompt = item.prompt.split(/\s+/).length > 60;
    main.innerHTML =
      '<div class="topbar"><span>Session ' + (sessionIndex(session.id) + 1) + ' · Batch ' + (step.b + 1) + ' of ' + nb + ' · Reply ' + (step.i + 1) + ' of ' + block.items.length + '</span><span class="dots">' + dots + '</span></div>' +
      (mins >= 10 ? '<div class="banner">You\'ve been at this for 10 minutes. Your progress is saved, so you can stop after this batch and finish later.</div>' : '') +
      '<div class="card"><div class="label">Their message</div><div class="md prompt-body' + (longPrompt ? ' clip' : '') + '" id="prompt">' + plainMarkdown(item.prompt) + '</div>' +
      (longPrompt ? '<button class="link small" id="more">Show the whole message</button>' : '') + '</div>' +
      '<div class="card"><div class="label">The AI\'s reply</div><p class="hint">Tap anything that bugs you.</p><div class="md" id="reply">' + renderDoc(item.doc) + '</div>' +
      '<p class="small muted" id="count" style="margin:10px 0 0"></p></div>' +
      '<div class="q">How tiring was this one to read? <span class="kbd">(keys 1-5)</span></div>' + scaleHtml('t', rec.t, 'not at all', 'very') +
      '<div class="q">Would it do the job? <span class="kbd">(Y, M, N)</span></div>' + choicesHtml('j', rec.j, [['yes', 'Yes'], ['mostly', 'Mostly'], ['no', 'No']]);
    var reply = document.getElementById('reply');
    rec.f.forEach(function (k) { var el = reply.querySelector('[data-u="' + k + '"]'); if (el) el.classList.add('on'); });
    function count() {
      document.getElementById('count').textContent = rec.f.length ? rec.f.length + (rec.f.length === 1 ? ' part flagged' : ' parts flagged') : '';
    }
    count();
    reply.addEventListener('click', function (e) {
      var u = e.target.closest('.u');
      if (!u || !reply.contains(u)) return;
      var k = Number(u.getAttribute('data-u'));
      var at = rec.f.indexOf(k);
      if (at >= 0) rec.f.splice(at, 1); else rec.f.push(k);
      u.classList.toggle('on', at < 0);
      count();
      save();
    });
    var more = document.getElementById('more');
    if (more) more.addEventListener('click', function () { document.getElementById('prompt').classList.remove('clip'); more.remove(); });
    function ready() { return rec.t != null && rec.j != null; }
    wireChoices(main, function (q, v) { rec[q] = v; save(); var n = document.getElementById('next'); if (n) n.disabled = !ready(); });
    var firstInBlock = step.i === 0;
    var nav = [];
    if (!firstInBlock) nav.push({label: 'Back', cls: 'back', onClick: function () { go(session, -1); }});
    nav.push({label: 'Next', cls: 'primary', id: 'next', disabled: !ready(), onClick: function () { if (ready()) go(session, 1); }});
    setNav(nav);
    startTimer(rec);
    keyHandler = function (e) {
      if (/^[1-5]$/.test(e.key)) pick('t', Number(e.key));
      else if (/^[ymn]$/i.test(e.key)) pick('j', {y: 'yes', m: 'mostly', n: 'no'}[e.key.toLowerCase()]);
      else if ((e.key === 'Enter' || e.key === 'ArrowRight') && ready()) go(session, 1);
      else if (e.key === 'ArrowLeft' && !firstInBlock) go(session, -1);
    };
  }

  function blockScreen(session, st, step) {
    var block = session.blocks[step.b];
    var rec = st.blocks[block.id] || (st.blocks[block.id] = {w: null});
    var nb = session.blocks.length;
    main.innerHTML =
      '<h2 class="screen">That\'s batch ' + (step.b + 1) + ' of ' + nb + '.</h2>' +
      '<div class="q">How worn out do those ' + block.items.length + ' replies leave you? <span class="kbd">(keys 1-5)</span></div>' + scaleHtml('w', rec.w, 'not at all', 'very') +
      '<p class="small muted" style="margin-top:14px">Think about the batch as a whole, as if these were replies you got in a row.</p>';
    wireChoices(main, function (q, v) { rec.w = v; save(); document.getElementById('next').disabled = false; });
    setNav([{label: step.b + 1 < nb ? 'Next batch' : 'Next', cls: 'primary', id: 'next', disabled: rec.w == null, onClick: function () { if (rec.w != null) go(session, 1); }}]);
    keyHandler = function (e) {
      if (/^[1-5]$/.test(e.key)) pick('w', Number(e.key));
      else if (e.key === 'Enter' && rec.w != null) go(session, 1);
    };
  }

  function endScreen(session, st) {
    var opts = session.blocks.map(function (b, i) { return [b.id, 'Batch ' + (i + 1)]; }).concat([['both_fine', 'Both were fine'], ['both_bad', 'Both were bad']]);
    main.innerHTML =
      '<h2 class="screen">Last question for this session</h2>' +
      '<div class="q">Which batch would you rather keep getting replies like? <span class="kbd">(keys 1-4)</span></div>' + choicesHtml('p', st.p, opts, 'four') +
      '<div class="q">Anything stand out? <span class="muted small">(optional)</span></div><textarea id="note" placeholder="A sentence or two is plenty.">' + esc(st.n) + '</textarea>';
    var note = document.getElementById('note');
    note.addEventListener('input', function () { st.n = note.value; save(); });
    wireChoices(main, function (q, v) { st.p = v; save(); document.getElementById('next').disabled = false; });
    setNav([
      {label: 'Back', cls: 'back', onClick: function () { go(session, -1); }},
      {label: 'Finish session', cls: 'primary', id: 'next', disabled: !st.p, onClick: function () {
        if (!st.p) return;
        st.end = new Date().toISOString();
        save();
        done(session);
      }}
    ]);
    keyHandler = function (e) {
      if (document.activeElement === note) return;
      if (/^[1-4]$/.test(e.key)) pick('p', opts[Number(e.key) - 1][0]);
    };
  }

  function done(session) {
    stopTimer();
    keyHandler = null;
    window.scrollTo(0, 0);
    var nxt = nextSession();
    var text = JSON.stringify(results());
    var who = (state.rater || 'rater').toLowerCase().replace(/[^a-z0-9]+/g, '-');
    var left = nxt ? KIT.sessions.length - sessionIndex(nxt.id) : 0;
    main.innerHTML =
      (session ? '<h1>Session ' + (sessionIndex(session.id) + 1) + ' done. Thank you!</h1>' : '<h1>Send your results</h1>') +
      '<p>Send your results to ' + esc(CONTACT) + ' however is easiest: copy them into a message, or download the file and attach it.</p>' +
      '<div class="row"><button class="primary" id="copy">Copy results</button><button id="dl">Download file</button></div>' +
      '<p class="small muted" id="copied" style="margin-top:8px"></p>' +
      '<p class="small"><button class="link" id="show">Show the results text</button></p>' +
      '<textarea id="raw" readonly hidden></textarea>' +
      (nxt ? '<div class="card"><p>' + (left === 1 ? 'One session is left.' : left + ' sessions are left.') + ' Come back another day for the next one, so your eyes are fresh.</p></div>'
           : '<div class="card"><p>That\'s every session. Thanks a lot for doing this.</p></div>');
    var raw = document.getElementById('raw');
    raw.value = text;
    document.getElementById('show').addEventListener('click', function () { raw.hidden = !raw.hidden; if (!raw.hidden) { raw.focus(); raw.select(); } });
    document.getElementById('copy').addEventListener('click', function () {
      var msg = document.getElementById('copied');
      function fallback() {
        raw.hidden = false; raw.focus(); raw.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        msg.textContent = ok ? 'Copied. Paste it into a message to ' + CONTACT + '.' : 'Select the text below and copy it.';
      }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function () { msg.textContent = 'Copied. Paste it into a message to ' + CONTACT + '.'; }, fallback);
      } else fallback();
    });
    document.getElementById('dl').addEventListener('click', function () {
      var blob = new Blob([text], {type: 'application/json'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'plain-voice-ratings-' + who + '-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    });
    setNav([{label: 'Back to start', onClick: home}]);
  }

  document.addEventListener('keydown', function (e) {
    if (!keyHandler || e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || (tag === 'TEXTAREA' && e.key !== 'Enter')) return;
    keyHandler(e);
  });

  home();
})();
</script>
</body>
</html>
